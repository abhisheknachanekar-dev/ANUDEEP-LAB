<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon Sign-In</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #111111;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Logo Styling */
    .logo-container {
      margin-top: 15px;
      margin-bottom: 18px;
      text-align: center;
    }

    .logo-container img {
      width: 103px;
      height: auto;
    }

    /* Card Box */
    .login-box {
      width: 350px;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 20px 26px;
      background-color: #fff;
    }

    .login-box h1 {
      font-weight: 400;
      font-size: 28px;
      line-height: 1.2;
      margin-bottom: 15px;
    }

    /* Form Layout */
    .form-group {
      margin-bottom: 14px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 5px;
    }

    label {
      font-size: 13px;
      font-weight: 700;
      display: block;
      margin-bottom: 5px;
    }

    .label-row label {
      margin-bottom: 0;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      height: 31px;
      padding: 3px 7px;
      border: 1px solid #a6a6a6;
      border-radius: 3px;
      outline: none;
      font-size: 13px;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #e77600;
      box-shadow: 0 0 3px 2px rgba(228, 121, 17, 0.5);
    }

    .forgot-link {
      font-size: 13px;
      color: #0066c0;
      text-decoration: none;
    }

    .forgot-link:hover {
      color: #c45500;
      text-decoration: underline;
    }

    /* Buttons */
    .btn-login {
      width: 100%;
      height: 31px;
      background: linear-gradient(to bottom, #f7dfa5, #f0c14b);
      border: 1px solid;
      border-color: #a88734 #9c7e31 #846a29;
      border-radius: 3px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 6px;
      margin-bottom: 18px;
    }

    .btn-login:hover {
      background: linear-gradient(to bottom, #f5d78e, #eeb933);
    }

    /* Checkbox Row */
    .checkbox-row {
      display: flex;
      align-items: center;
      font-size: 13px;
      margin-bottom: 22px;
    }

    .checkbox-row input {
      margin-right: 6px;
    }

    .details-link {
      color: #0066c0;
      text-decoration: none;
      margin-left: 3px;
    }

    .details-link:hover {
      color: #c45500;
      text-decoration: underline;
    }

    /* Divider */
    .divider {
      position: relative;
      text-align: center;
      margin-bottom: 14px;
    }

    .divider::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background-color: #e7e7e7;
      z-index: 1;
    }

    .divider span {
      position: relative;
      z-index: 2;
      background-color: #fff;
      padding: 0 8px;
      font-size: 12px;
      color: #767676;
    }

    /* Create Account Button */
    .btn-create {
      display: block;
      width: 100%;
      height: 31px;
      line-height: 29px;
      text-align: center;
      background: linear-gradient(to bottom, #f7f8fa, #e7e9ec);
      border: 1px solid;
      border-color: #adb1b8 #a2a6ac #8d9096;
      border-radius: 3px;
      font-size: 13px;
      color: #111;
      text-decoration: none;
    }

    .btn-create:hover {
      background: linear-gradient(to bottom, #e7e9ec, #dfe3e6);
    }

    /* Footer */
    footer {
      margin-top: 30px;
      width: 100%;
      text-align: center;
      font-size: 11px;
    }

    .footer-links {
      margin-bottom: 10px;
    }

    .footer-links a {
      color: #0066c0;
      text-decoration: none;
      margin: 0 10px;
    }

    .footer-links a:hover {
      color: #c45500;
      text-decoration: underline;
    }

    .copyright {
      color: #555;
    }
  </style>
</head>
<body>

  <!-- Amazon Logo -->
  <div class="logo-container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon Logo">
  </div>

  <!-- Main Login Card -->
  <div class="login-box">
    <h1>Login</h1>

    <form>
      <div class="form-group">
        <label for="email">Email or mobile phone number</label>
        <input type="text" id="email" id="email" required>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password">Password</label>
          <a href="#" class="forgot-link">Forgot Password</a>
        </div>
        <input type="password" id="password" required>
      </div>

      <button type="submit" class="btn-login">Login</button>

      <div class="checkbox-row">
        <input type="checkbox" id="remember">
        <label for="remember" style="font-weight: normal; margin-bottom: 0;">Keep me signed in.</label>
        <a href="#" class="details-link">Details &#9662;</a>
      </div>
    </form>

    <div class="divider">
      <span>New to Amazon?</span>
    </div>

    <a href="#" class="btn-create">Create your Amazon account</a>
  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-links">
      <a href="#">Conditions of Use</a>
      <a href="#">Privacy Notice</a>
      <a href="#">Help</a>
    </div>
    <div class="copyright">
      &copy; 1996-2017, Amazon.com, Inc. or its affiliates
    </div>
  </footer>

</body>
</html>
